name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Group by ref and sha so pushes to main do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

# Checkout the event commit in every job. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event_name == 'push' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.event_name == 'push' && github.sha || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

  # The wallet ledger and subscription settlement contracts (same-transaction
  # rollback, idempotent replay, hourly consumption aggregation, refund
  # idempotency, settlement overflow charged to the wallet, reconciliation, and
  # the subscription plan group/model restrictions with hour/day/week/month
  # quota windows) are verified on real MySQL and PostgreSQL. The model tests
  # skip the dialects whose DSN is unset, and the SQLite subtests still run in
  # the backend job.
  backend-real-db:
    name: Backend wallet and subscription settlement on real databases (${{ matrix.db }})
    if: github.event_name == 'push' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: ${{ matrix.mysql_dsn }}
      TEST_POSTGRES_DSN: ${{ matrix.postgres_dsn }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            image: mysql:8.0
            port: 3306
            health_cmd: mysqladmin ping -h 127.0.0.1 -uroot -proot
            mysql_dsn: root:root@tcp(127.0.0.1:3306)/new_api_wallet_ledger?charset=utf8mb4&parseTime=True&loc=Local
            postgres_dsn: ''
          - db: postgres
            image: postgres:16
            port: 5432
            health_cmd: pg_isready -U root -d new_api_wallet_ledger
            mysql_dsn: ''
            postgres_dsn: host=127.0.0.1 port=5432 user=root password=root dbname=new_api_wallet_ledger sslmode=disable
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: new_api_wallet_ledger
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: new_api_wallet_ledger
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health_cmd }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.event_name == 'push' && github.sha || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Test wallet ledger and subscription settlement on ${{ matrix.db }}
        run: go test ./model/ -run 'TestWallet|TestSubscriptionPreConsumeRefund|TestSubscriptionSettlement|TestCreditGrant|TestSubscriptionLimits|TestPaymentReversal|TestRefundUnusedTopUpBalance|TestSubscriptionOrderReversal' -count=1 -v

  backend-databases:
    name: Backend quota schema on MySQL and PostgreSQL
    if: github.event_name == 'push' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/newapi_test?charset=utf8mb4&parseTime=true'
      TEST_POSTGRES_DSN: 'postgres://newapi:newapi@127.0.0.1:5432/newapi_test?sslmode=disable'

    services:
      mysql8:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: newapi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mysql57:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: newapi_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: newapi
          POSTGRES_PASSWORD: newapi
          POSTGRES_DB: newapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U newapi -d newapi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.event_name == 'push' && github.sha || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Test quota schema migration on MySQL 8 and PostgreSQL
        run: go test ./model/ -run 'TestQuotaBigint' -count=1 -v

      - name: Test quota schema migration on MySQL 5.7
        env:
          TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3307)/newapi_test?charset=utf8mb4&parseTime=true'
        run: go test ./model/ -run 'TestQuotaBigintMigrationConfiguredDatabases/mysql' -count=1 -v

      - name: Test Playground knowledge schema on MySQL 5.7
        env:
          TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3307)/newapi_test?charset=utf8mb4&parseTime=true'
        run: go test ./model/ -run 'TestPlaygroundKnowledgeBaseMatrix/mysql' -count=1 -v

      - name: Test playground preset and conversation metadata schema on MySQL 8 and PostgreSQL
        run: go test ./model/ -run 'TestPlaygroundPresetSchemaMigration' -count=1 -v

      - name: Test playground preset schema migration on MySQL 5.7
        env:
          TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3307)/newapi_test?charset=utf8mb4&parseTime=true'
        run: go test ./model/ -run 'TestPlaygroundPresetSchemaMigration/mysql' -count=1 -v

      - name: Test playground conversation organization on MySQL 8 and PostgreSQL
        run: go test ./model/ -run 'TestPlaygroundSessionOrganization' -count=1 -v

      - name: Test playground conversation organization on MySQL 5.7
        env:
          TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3307)/newapi_test?charset=utf8mb4&parseTime=true'
        run: go test ./model/ -run 'TestPlaygroundSessionOrganization/mysql' -count=1 -v

  database:
    name: Backend real-database tests
    if: github.event_name == 'push' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/new_api_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/new_api_test?sslmode=disable
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: new_api_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: new_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.event_name == 'push' && github.sha || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Test batch update flush, token quota adjustments, periodic token budgets, wallet debt, storage billing, and Playground message deltas, attachment storage, document text extraction, presigned uploads, presets, prompt snippets, system prompts, context management, parallel comparisons, stable group references, usage counters, affiliate codes, referral relations, referral commissions, referral anti-abuse limits and registration signals, referral invitation statistics, the legacy referral import and affiliate transfer idempotency, subscription redemption codes, canvas snapshots, archive export and import, trash and export, task artifacts, object delete outbox retries, and object-store reconciliation on SQLite, MySQL, and PostgreSQL
        run: go test ./model/ -run 'TestBatchUpdateShutdownFlushMatrix|TestFlushBatchUpdateTimeoutLogsAndRetainsDeltas|TestTokenQuotaUpdatePreservesConcurrentDeductions|TestTokenPeriodQuotaBudgetMatrix|TestPlaygroundKnowledgeBaseMatrix|TestPlaygroundMessageDelta|TestPlaygroundMessageUniquenessMigration|TestPlaygroundMessageCostLookup|TestPlaygroundMessageVersionBranches|TestPlaygroundParallelCompareGroups|TestPlaygroundWalletDebt|TestPlaygroundStorageBilling|TestPlaygroundAttachmentPersistenceMatrix|TestPlaygroundAttachmentStorageSchemaMigration|TestPlaygroundAttachmentDocumentText|TestPlaygroundUploadFlow|TestPlaygroundObjectDeleteOutboxMatrix|TestPlaygroundObjectReconcileMatrix|TestPlaygroundCanvasAttachmentUpload|TestPlaygroundCanvasSnapshotHistory|TestPlaygroundCanvasArchiveRoundTrip|TestPlaygroundCanvasLargeDocumentExternalization|TestPlaygroundPresetPersistenceAndOwnership|TestPlaygroundPresetMarketAndGlobalManagement|TestPlaygroundPresetSchemaMigration|TestPlaygroundSnippetPersistenceAndOwnership|TestPlaygroundSessionSystemPrompt|TestPlaygroundSessionContextManagement|TestPlaygroundUserUsage|TestStableGroupReferenceMigration|TestAffCode|TestReferralBinding|TestReferralCommission|TestReferralRegistrationSignals|TestReferralInvitationStats|TestLegacyReferral|TestAffiliateTransfer|TestRedeemSubscriptionPlanCodeMatrix|TestPlaygroundTaskArtifactRecordsAndPins|TestPlaygroundTrashLifecycle|TestPlaygroundCanvasTrashLifecycle|TestPaymentReversal|TestRefundUnusedTopUpBalance|TestSubscriptionOrderReversal' -count=1 -v

      # The redemption controller stores the granted plan on every generated
      # code, so its create/validation matrix runs against the same real
      # databases.
      - name: Test subscription redemption code creation on MySQL and PostgreSQL
        run: go test ./controller/ -run 'TestAddRedemptionSubscriptionCodes' -count=1 -v

      # The workspace workflow endpoints price steps, reserve a run cap as a
      # wallet hold and settle the unspent part; the matrix runs on the same
      # real databases.
      - name: Test playground workflow run budgets on MySQL and PostgreSQL
        run: go test ./controller/ -run 'TestPlaygroundWorkflowBudgetEndpoints' -count=1 -v

      # RF-08: the referral agent mark resolves its commission rate against the
      # real databases.
      - name: Test referral agent admin endpoints on MySQL
        env:
          TEST_MANAGE_USER_DIALECT: mysql
        run: go test ./controller/ -run 'TestReferralAgentAdminEndpoints' -count=1 -v

      - name: Test referral agent admin endpoints on PostgreSQL
        env:
          TEST_MANAGE_USER_DIALECT: postgres
        run: go test ./controller/ -run 'TestReferralAgentAdminEndpoints' -count=1 -v

  frontend:
    name: Frontend typecheck and test
    if: github.event_name == 'push' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.event_name == 'push' && github.sha || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
